<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Registro" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1e40af" />
  <title>Registro Produccion</title>
  <link rel="stylesheet" href="styles.css?v=1.8.44" />
  <link rel="icon" href="data:,">
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="syncBadge" title="Tocar para forzar envio" style="position:fixed;bottom:6px;left:8px;font-size:12px;font-weight:800;z-index:100;cursor:pointer;padding:4px 10px;border-radius:999px;user-select:none;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;">v1.8.45 &#10003;</div>

  <!-- LEGAJO -->
  <div id="legajoScreen">
    <button id="btnHistDias" style="position:fixed;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:2px solid #cbd5e1;background:#f8fafc;font-size:20px;cursor:pointer;z-index:100;display:flex;align-items:center;justify-content:center;" title="Historial dias anteriores">📅</button>
    <h1>Ingresa tu numero de Operario</h1>
    <input id="legajoInput" type="number" inputmode="numeric">
    <button id="btnContinuar" class="primary-btn">Continuar</button>

    <div class="history-wrap">
      <div class="history-title">Resumen del dia (en este dispositivo)</div>
      <div id="daySummary" class="history-empty">Ingresa tu legajo para ver el resumen</div>
    </div>
    <div id="pendingSection" class="pending-section hidden">
      <div class="pending-title">Pendientes en cola (este dispositivo)</div>
      <div id="pendingList" class="pending-list"></div>
    </div>

  </div>

  <!-- OPCIONES -->
  <div id="optionsScreen" class="hidden">
    <button id="btnTerminarDia" style="position:fixed;top:10px;right:10px;width:auto;padding:8px 14px;font-size:14px;font-weight:bold;background:#dc2626;color:#fff;border:2px solid #991b1b;border-radius:8px;cursor:pointer;margin:0;line-height:1;z-index:50;">Terminar Día</button>
    <div class="top-bar">
      <div id="btnBackTop" class="back-top">&larr;</div>
      <div id="btnBackLabel" class="back-label">Volver a pantalla inicial</div>
    </div>

    <div class="row row-2" id="row1"></div>
    <div class="row row-5" id="row2"></div>
    <div class="row row-5" id="row3"></div>
    <div class="row row-4" id="row4"></div>

    <div id="selectedArea" class="hidden">
      <div class="selected-container">
        <div id="btnResetSelection" class="back-arrow">&larr;</div>
        <div id="selectedBox" class="selected-box"></div>
        <div id="selectedDesc" class="selected-desc"></div>
      </div>

      <div id="inputArea" class="hidden">
        <div id="inputLabel" class="label"></div>
        <input id="textInput" class="text-input" autocomplete="off">
      </div>

      <div id="matrizInfo" class="matriz-info hidden"></div>

      <div id="cajonCompletoWrap" class="hidden" style="margin:8px 0;padding:10px;border-radius:8px;background:#fff7ed;border:1px solid #fed7aa;">
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#9a3412;cursor:pointer;">
          <input type="checkbox" id="cajonCompletoChk" style="width:20px;height:20px;">
          Cerrar caj&oacute;n como <b>completo</b> (no hay m&aacute;s material para esta matriz)
        </label>
      </div>

      <button id="btnEnviar" class="primary-btn">Enviar</button>
      <div id="error" class="error"></div>
    </div>
  </div>

  <!-- MODAL EDICION -->
  <div id="editModal" class="edit-modal hidden">
    <div class="edit-modal-box">
      <div class="edit-modal-header">Editar registro</div>
      <div class="edit-modal-body">
        <div class="edit-field">
          <label>Codigo</label>
          <select id="editCode"></select>
        </div>
        <div class="edit-field" id="editTextoWrap">
          <label>Valor</label>
          <input type="text" id="editTexto" />
        </div>
        <div class="edit-field">
          <label>Evento</label>
          <input type="text" id="editTs" disabled />
        </div>
        <div class="edit-field">
          <label>Estado</label>
          <input type="text" id="editStatus" disabled />
        </div>
      </div>
      <div class="edit-modal-footer">
        <button class="edit-btn edit-btn-cancel" id="editCancel">Cancelar</button>
        <button class="edit-btn edit-btn-save" id="editSave">Guardar</button>
      </div>
    </div>
  </div>

  <!-- MODAL TERMINAR DIA -->
  <div id="terminarDiaModal" class="td-modal hidden">
    <div class="td-modal-card">
      <div class="td-modal-header">
        <span class="td-modal-title">Terminar día</span>
        <button class="td-modal-close" id="btnCancelTD">Cancelar</button>
      </div>
      <div class="td-modal-body" id="terminarDiaContent"></div>
      <div class="td-modal-footer">
        <button id="btnConfirmTD" class="td-confirm-btn">Sí, terminar día</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=1.8.44"></script>
</body>
</html>
